# 全真容器化测试档依赖（docs/plans/全真容器化测试迁移方案-2026.10.md §3.5）：
#   docker compose -f compose.test.yml up -d
# 一次性专用容器：数据不落盘（无 volume），禁止指向日常/生产实例。
# PG 端口 55433 与 loadtest（55432）错开可共存；Redis 56379 与 loadtest 同端口，
# 两者不可同时运行（Redis 无状态，先后运行即可）。
# 若此前按 nightly runbook 用 docker run 起过 xadmin-pgtest-pg，需先移除再 up（端口冲突）。
# E2E（tests/settings_e2e，xadmin-client 跑批器）复用本文件的 postgres 服务（库名 xadmin_e2e*，
# 由 scripts/e2e_seed.py DROP/CREATE 重置）；E2E 缓存为进程内 FakeRedis，无需 redis 服务。
# 独立项目名：避免与开发栈（默认项目 xadmin-server）同项目，防止 down --remove-orphans 误删开发容器。
name: xadmin-test
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: xadmin-test-pg
    # xdist 按 CPU 数起 worker（每 worker 独立测试库 + 独立 psycopg 连接池，
    # min/max_size 2/8）：18 worker 满负载时连接数轻松越过 PG 默认 max_connections=100，
    # 撞顶表现为随机用例 fixture 阶段报「too many connections」/池超时（容量类偶发红）。
    # 开发栈 docker-compose.yml 已按 200 起配；测试档按满载余量放宽到 300。
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: server
      POSTGRES_PASSWORD: pgtest
      POSTGRES_DB: xadmin_realtest
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U server -d xadmin_realtest"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.2
    container_name: xadmin-test-redis
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
