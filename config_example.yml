# SECURITY WARNING: keep the secret key used in production secret!
# 加密密钥 生产服必须保证唯一性，你必须保证这个值的安全，否则攻击者可以用它来生成自己的签名值
# $ cat /dev/urandom | tr -dc A-Za-z0-9 | head -c 49;echo
SECRET_KEY:

# Development env open this, when error occur display the full process track, Production disable it
# DEBUG 模式 开启DEBUG后遇到错误时可以看到更多日志，正式服要禁用，开发阶段，需要取消该注释，否则会导致前端ws连接失败
# DEBUG: true

# DEBUG, INFO, WARNING, ERROR, CRITICAL can set. See https://docs.djangoproject.com/zh-hans/5.0/topics/logging/
# 日志级别
# LOG_LEVEL: DEBUG

# 应用日志格式：text（默认，人类可读）/ json（结构化，供 Loki/ELK 等采集端解析）
# LOG_FORMAT: json

# 按天滚动的日志保留天数，超出后整体清理日期目录（0 表示不清理，默认 30）
# LOG_BACKUP_COUNT: 30

# Sentry 错误聚合（DEP-3）：配置 DSN 后自动启用 Django/Celery 集成；为空则完全不初始化
# SENTRY_DSN: "https://<key>@<host>/<project>"
# SENTRY_ENVIRONMENT: production
# SENTRY_TRACES_SAMPLE_RATE: 0.0

# DRF Basic 认证开关：base64 明文凭证，默认关闭，仅本地调试按需开启
# BASIC_AUTH_ENABLED: true

# 用于DEBUG模式下，输出sql日志
# DEBUG_DEV: true

# django-silk 性能剖析（T3.1 性能基线，仅 DEBUG/DEBUG_DEV 环境生效）
# 开启前先安装 dev 依赖：pip install -r requirements-dev.txt（含 django-silk），并执行 python manage.py migrate
# 面板地址 /silk（需员工/超级管理员登录）；k6 基线测定时必须保持关闭，避免剖析开销污染基线数据
# SILK_ENABLED: true

# Host 校验白名单（生产环境必须配置，DEBUG 模式默认放行所有 Host）
# ALLOWED_HOSTS:
#   - xadmin.example.com

# 反向代理信任清单（单个 IP 或 CIDR）：仅当直连地址命中清单时才解析 X-Forwarded-For
# 取客户端真实 IP，否则一律使用直连地址（防伪造 IP 绕过登录封禁 / PAT IP 白名单）。
# 默认空 = 不信任任何 XFF；仅 HTTP 反代（会覆写/追加 XFF）场景才可配置，纯 TCP 代理勿配
# TRUSTED_PROXY_IPS:
#   - 192.168.196.0/24

# HTTPS 部署安全头（默认 false = HTTP 直连部署零影响）：
# 开启后强制 Secure Cookie（Session/CSRF）+ HSTS 一年（含子域/preload）+ nosniff，
# 仅在 TLS 终止于反向代理/网关且对外入口为 HTTPS 时开启
# SECURITY_HTTPS_ENABLED: false
# 是否由 Django 执行 HTTP→HTTPS 301 跳转：仅当代理层会正确传递 X-Forwarded-Proto: https
# 时才可开启；纯 TCP stream 代理（内置 nginx 默认形态）下开启会造成重定向循环
# SECURITY_HTTPS_REDIRECT_ENABLED: false

# CORS 跨域配置（同源部署/nginx 反代无需配置；跨域部署请配置域名白名单）
# CORS_ALLOW_ALL_ORIGINS: false
# CORS_ALLOWED_ORIGINS:
#   - https://xadmin.example.com

# Database setting, Support sqlite3, mysql, postgres ....
# 数据库设置
# ### 更多数据库配置，参考官方文档：https://docs.djangoproject.com/zh-hans/5.0/ref/databases/
# 创建竖数据库sql
# create database xadmin default character set utf8mb4 COLLATE utf8mb4_bin;
# grant all on xadmin.* to server@'127.0.0.1' identified by 'KGzKjZpWBp4R4RSa';

# SQLite setting:
# 使用单文件sqlite数据库
# DB_ENGINE: sqlite3
# DB_DATABASE:
# MySQL or postgres setting like:
# DB_ENGINE can set mysql, oracle, postgresql, sqlite3

# 使用 Mariadb 作为数据库
#DB_ENGINE: mysql
#DB_HOST: mysql
#DB_PORT: 3306

# 使用 postgresql 作为数据库[默认数据库]
DB_ENGINE: postgresql
DB_HOST: postgresql
DB_PORT: 5432

DB_USER: server
DB_DATABASE: xadmin
#DB_PASSWORD: KGzKjZpWBp4R4RSa


# Use Redis as broker for celery and web socket
# Redis配置
REDIS_HOST: redis
REDIS_PORT: 6379
#REDIS_PASSWORD: <your-redis-password>
#DEFAULT_CACHE_ID: 1
#CHANNEL_LAYERS_CACHE_ID: 2
#CELERY_BROKER_CACHE_ID: 3

# When Django start it will bind this host and port
# ./manage.py runserver 127.0.0.1:8896
# 运行时绑定端口
HTTP_BIND_HOST: 0.0.0.0
HTTP_LISTEN_PORT: 8896
GUNICORN_MAX_WORKER: 4
CELERY_WORKER_COUNT: 4
# heavy 队列（导入/导出/批量重任务）worker 配置。
# CPU 密集的 Excel 导出可把 POOL 改为 'prefork' 提升吞吐（threads 池受 GIL 限制）
# CELERY_HEAVY_POOL: threads
# CELERY_HEAVY_CONCURRENCY: 4

# Celery Flower 任务监控（默认关闭外网暴露：仅绑定 127.0.0.1）
# CELERY_FLOWER_HOST: 127.0.0.1
# CELERY_FLOWER_PORT: 5566
# Flower 监控 basic-auth（格式 用户:密码）；生产环境必须配置，未配置时仅允许绑定 127.0.0.1
# CELERY_FLOWER_AUTH: flower:<your-flower-password>

# 软删除回收站保留天数（超过后由 purge_soft_deleted 周期任务物理清除）
# RECYCLE_BIN_RETENTION_DAYS: 30

# 字段级审计 diff 白名单（模型 _meta.label），决定「变更历史」弹窗能否看到
# 字段明细（未命中白名单的模型 changes 恒为空，前端显示「—」）。
# 默认已开启 system.UserInfo（用户管理页的变更历史入口）；命中白名单的 update 请求会
# 额外做 2 次查询。注意：显式配置本项会整体覆盖默认值；置空数组表示关闭该能力
# AUDIT_DIFF_MODELS:
#   - system.UserInfo
#   - system.UserRole

# ---------------------------------------------------------------------------
# 功能模块裁剪（二开友好）：不改代码即可把后台裁剪成需要的样子
#   full     = 全部功能（默认，与不配置完全一致）
#   standard = 内核 + 标配（去掉聊天室/AI/数据分析/表单采集/审批流引擎/事件订阅/
#              开放平台/全局搜索/SCIM 共 9 个可选模块，推荐二次开发起点）
#   core     = 仅内核（身份权限/配置/文件/通知/审计）
# 模块清单、每个模块覆盖的菜单与路由见 docs/architecture/模块化与功能裁剪.md
# 注意：模块开关需重启进程生效；关闭模块只隐藏与拦截，不删除任何数据
# ---------------------------------------------------------------------------
# MODULE_PRESET: full
# MODULE_ENABLE:
#   - chat
# MODULE_DISABLE:
#   - analysis
#   - webhook

# 需要将创建的应用写到里面（第三方/自有 app 必须在此注册才会参与
# makemigrations / migrate / 路由自动注入）。
# 官方二开范例 demo（Book 四件套，「两行代码一个页面」）默认关闭，
# 需要体验时取消下一行注释启用：
# XADMIN_APPS: [demo]
XADMIN_APPS: