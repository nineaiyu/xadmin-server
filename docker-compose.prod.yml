# 生产编排 overlay：叠加在默认栈之上使用（默认栈的 compose 即开发形态，见其文件头说明）
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 与默认（开发）栈的差异：
#   1. 应用镜像走生产 Dockerfile：代码烘焙进镜像、非 root（1001）、无源码 bind mount；
#   2. 应用数据目录 bind mount 宿主 ./data（上传/日志），与 db-backup 的媒体备份同源。
#      首次启用需 chown 1001:1001 ./data（容器内非 root，属主要求见 Dockerfile 注释）；
#   3. 其余（凭据强制注入、网络、健康检查、备份/PITR）全部继承默认栈。
#
# 依赖 docker compose v2.24.4+（volumes 的 !reset 标签）；凭据注入见 .env.example。
# 修改业务代码后需重新 build 镜像（默认栈的源码 bind mount 热更新仅限开发形态）。

services:
  # 一次性数据库迁移服务（不常驻、无 container_name）：
  #
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml build server
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm migrate
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
  #
  # 用途：① 多副本/滚动发布的前置步骤（web 侧配 AUTO_MIGRATE=false，避免两个副本
  # 同时迁移）；② 发布窗口内需要「先迁移后放量」时的手工步骤；③ 迁移失败时不必
  # 反复重启 web 容器。单副本沿用启动自动迁移（AUTO_MIGRATE 默认 true）行为不变。
  migrate:
    image: xadmin-server
    hostname: xadmin-migrate
    restart: "no"
    command: ["migrate"]
    environment:
      # 与基础栈同源：config.yml → 环境变量 → 内置默认值
      DB_PASSWORD: ${DB_PASSWORD:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes: !override
      - ./data:/data/xadmin-server/data
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - net

  # 生产强制异地副本：默认置 1，脚本对「未配置异地副本」做启动自检告警
  # + 单次模式非零退出（不会停掉本地备份）；确无第二故障域的部署显式
  # `BACKUP_REMOTE_REQUIRED=0` 关闭，并在发布清单留痕（详见 docs/ops/deployment.md §3.1）
  db-backup:
    environment:
      BACKUP_REMOTE_REQUIRED: ${BACKUP_REMOTE_REQUIRED:-1}

  server:
    build:
      dockerfile: Dockerfile
    volumes: !override
      - ./data:/data/xadmin-server/data

  celery-worker:
    build:
      dockerfile: Dockerfile
    volumes: !override
      - ./data:/data/xadmin-server/data

  celery-heavy:
    build:
      dockerfile: Dockerfile
    volumes: !override
      - ./data:/data/xadmin-server/data

  celery-beat:
    build:
      dockerfile: Dockerfile
    volumes: !override
      - ./data:/data/xadmin-server/data
