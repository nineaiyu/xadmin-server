# 构建参数（可用环境变量覆盖，无需改本文件）：
#   PIP_MIRROR=https://pypi.org/simple docker compose build   # 默认华为云；镜像源同步滞后缺版本时用它兜底
#   UV_CONCURRENT_DOWNLOADS=8 docker compose build      # 镜像源按 IP 限流时调小，总吞吐反而更高
x-build-args: &xadmin-build-args
  PIP_MIRROR: ${PIP_MIRROR:-https://mirrors.huaweicloud.com/repository/pypi/simple}
  APT_MIRROR: ${APT_MIRROR:-http://mirrors.huaweicloud.com}
  UV_CONCURRENT_DOWNLOADS: ${UV_CONCURRENT_DOWNLOADS:-50}

# 应用容器凭据透传：Config 取值链为 config.yml → 环境变量 → 内置默认值，
# 因此仅当 config.yml 未定义同名键时这里才生效（config.yml 仍是应用侧唯一定义处）。
# 无 config.yml 的快速启动场景由 .env 提供与 PG/Redis 一致的凭据
x-app-env: &xadmin-app-env
  DB_PASSWORD: ${DB_PASSWORD:-}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  # 开发态热加载开关：`bash utils/dev_up.sh --hot` 会 export DEBUG=true
  # （gunicorn --reload，web 容器改代码自动重载）；空值 = 未启用，默认行为不变
  DEBUG: ${DEBUG:-}

networks:
  net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.196.0/24

services:
  nginx:
    image: registry.cn-beijing.aliyuncs.com/nineaiyu/nginx:1.31.5-alpine
    container_name: xadmin-nginx
    restart: always
    volumes:
      - ./utils/nginx.conf:/etc/nginx/nginx.conf:r
      # 后端形态（单副本变量式 / 多副本 upstream+zone+resolve）：多副本部署由
      # docker-compose.scale.yml 覆盖挂载 multi 版，主配置保持不变
      - ./utils/xadmin-backend.single.conf:/etc/nginx/xadmin-backend.conf:r
      - ./data/logs:/var/log/nginx
    ports:
      - "8896:8896"
    networks:
      - net

  postgresql:
    image: registry.cn-beijing.aliyuncs.com/nineaiyu/pgvector:pg17
    container_name: xadmin-postgresql
    restart: always
    # 8000 远超应用实际需求（CONN_MAX_AGE 持久连接 × worker 数），
    # 仅徒增 PG 内存基线；确需更高并发时引入 pgbouncer（同类预案见 docs/adr）
    # PITR（2026-09-16 启用，见 docs/ops/pitr.md）：
    #   - archive_mode=on 需重启生效（archive_command/timeout 可 reload）；
    #   - 归档用 gzip 压缩（空段 16MB → KB 级，磁盘成本≈0），restore 端 gunzip；
    #   - 归档卷默认与数据同盘（单机退让，风险与迁移条件见 pitr.md §6）；
    #     换独立盘/NFS 时**只改宿主路径**（容器内路径不变）：
    #       PITR_ARCHIVE_DIR=/mnt/pitr-archive docker compose up -d postgresql
    #     （未设置时回落到 ${VOLUME_DIR}/xadmin-postgresql/archive）
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60
      - -c
      - "archive_command=test ! -f /var/lib/postgresql/archive/%f.gz && gzip < %p > /var/lib/postgresql/archive/%f.gz"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: ${DB_DATABASE:-xadmin}
      POSTGRES_USER: ${DB_USER:-server}
      # 凭据不在仓库中落值：由 .env / 环境变量强制注入（缺失即报错拒启）。
      # dev_up.sh 会在 .env 缺失时从 config.yml 同步或随机生成；config.yml 仍是应用侧唯一定义处
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - run utils/dev_up.sh (auto-passes from config.yml), or set it in .env (see .env.example) / environment}
    volumes:
      - ${VOLUME_DIR:-../}/xadmin-postgresql/data:/var/lib/postgresql/data
      # 归档独立盘：PITR_ARCHIVE_DIR 指向第二块盘/挂载点（NFS 亦可）即为「分盘」形态，
      # 迁移完成日期回填 pitr.md §6；容器内路径恒定，无需改归档器与恢复脚本
      - ${PITR_ARCHIVE_DIR:-${VOLUME_DIR:-../}/xadmin-postgresql/archive}:/var/lib/postgresql/archive
    healthcheck:
      test: "pg_isready -q -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - net

  redis:
    image: registry.cn-beijing.aliyuncs.com/nineaiyu/redis:8.10.2
    container_name: xadmin-redis
    hostname: xadmin-redis
    restart: always
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required - run utils/dev_up.sh (auto-passes from config.yml), or set it in .env (see .env.example) / environment}", "--port", "${REDIS_PORT:-6379}" ]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required - run utils/dev_up.sh (auto-passes from config.yml), or set it in .env (see .env.example) / environment}
    volumes:
      - ${VOLUME_DIR:-../}/xadmin-redis/data:/data
    healthcheck:
      test: "redis-cli -h 127.0.0.1 -p $$REDIS_PORT -a $$REDIS_PASSWORD info Replication"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - net

  db-backup:
    image: registry.cn-beijing.aliyuncs.com/nineaiyu/pgvector:pg17
    container_name: xadmin-db-backup
    restart: always
    entrypoint: [ "bash", "/utils/db_backup.sh" ]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PGHOST: postgresql
      PGPORT: 5432
      PGUSER: ${DB_USER:-server}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - run utils/dev_up.sh (auto-passes from config.yml), or set it in .env (see .env.example) / environment}
      PGDATABASE: ${DB_DATABASE:-xadmin}
      BACKUP_DIR: /backups
      KEEP_DAYS: 7
      # RPO 目标 6h（21600s，原 24h）；仍需更短窗口则走 WAL 归档/PITR（独立立项）
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-21600}
      # 媒体目录入备份（只读挂载 ./data/upload）
      BACKUP_MEDIA: ${BACKUP_MEDIA:-true}
      MEDIA_DIR: /media
      # 异地副本。local=挂载第二块盘/NFS；rsync=远端主机；rclone=云对象存储。
      # 留空表示未启用（脚本跳过同步，仅本地保留）
      BACKUP_REMOTE_TYPE: ${BACKUP_REMOTE_TYPE:-}
      BACKUP_REMOTE_TARGET: ${BACKUP_REMOTE_TARGET:-}
      BACKUP_REMOTE_KEEP_DAYS: ${BACKUP_REMOTE_KEEP_DAYS:-7}
      # 生产强制异地副本：置 1 时脚本在启动自检与单次模式退出码上暴露「未配置异地副本」
      # （常驻模式仍继续本地备份，只记 ERROR/告警——不允许因缺异地配置停掉本地备份）；
      # 生产 overlay 默认置 1，确认无第二故障域可用的部署显式设 0 并在发布清单留痕
      BACKUP_REMOTE_REQUIRED: ${BACKUP_REMOTE_REQUIRED:-0}
    volumes:
      - ./utils/db_backup.sh:/utils/db_backup.sh:ro
      - ./data/upload:/media:ro
      - ${VOLUME_DIR:-../}/xadmin-db-backups:/backups
      # local 异地副本的目标挂载点（BACKUP_REMOTE_TYPE=local 时容器写入此目录）。
      # 生产应指向独立磁盘/NFS，而非与源库同盘的目录：
      #   BACKUP_REMOTE_DIR=/mnt/backup-remote docker compose up -d db-backup
      - ${BACKUP_REMOTE_DIR:-${VOLUME_DIR:-../}/xadmin-db-backups-remote}:/remote
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - net

  server:
    image: xadmin-server
    container_name: xadmin-server
    hostname: xadmin-server
    build:
      context: .
      dockerfile: Dockerfile-dev
      args: *xadmin-build-args
    ulimits:
      core: 0
    restart: always
    command: start web
    environment: *xadmin-app-env
    volumes:
      - ./:/data/xadmin-server
    #      - ${VOLUME_DIR:-.}/server/data:/data/xadmin-server/data
    # 停止宽限期须大于 gunicorn --graceful-timeout 30（否则 docker 默认 10s 就 SIGKILL，
    # 在途请求被截断、滚动重建必然断连——见 docs/ops/blue-green.md）
    stop_grace_period: 40s
    healthcheck:
      test: "curl -fsL http://localhost:8896/api/common/api/health > /dev/null"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    # 只声明真实依赖并等依赖健康：nginx 无 healthcheck，排序语义弱且 server 不反向依赖
    # 代理（前端页面层/L4 转发都是 nginx → server 方向）
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - net

  celery-worker:
    image: xadmin-server
    container_name: xadmin-celery-worker
    hostname: xadmin-celery-worker
    build:
      context: .
      dockerfile: Dockerfile-dev
      args: *xadmin-build-args
    ulimits:
      core: 0
    restart: always
    command: start celery_default
    environment: *xadmin-app-env
    volumes:
      - ./:/data/xadmin-server
    #      - ${VOLUME_DIR:-.}/server/data:/data/xadmin-server/data
    # celery 收到 SIGTERM 走 warm shutdown（跑完在途任务再退）；默认 10s 会 SIGKILL
    # 长任务，这里放宽到 120s（更长的任务用 docker compose stop -t 覆盖）
    stop_grace_period: 120s
    healthcheck:
      test: "bash utils/check_celery.sh celery"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      - postgresql
      - redis
    networks:
      - net

  celery-heavy:
    image: xadmin-server
    container_name: xadmin-celery-heavy
    hostname: xadmin-celery-heavy
    build:
      context: .
      dockerfile: Dockerfile-dev
      args: *xadmin-build-args
    ulimits:
      core: 0
    restart: always
    command: start celery_heavy
    environment: *xadmin-app-env
    volumes:
      - ./:/data/xadmin-server
    #      - ${VOLUME_DIR:-.}/server/data:/data/xadmin-server/data
    # 重队列（导出/报表/导入）单任务可能数分钟：warm shutdown 宽限期放宽到 300s
    stop_grace_period: 300s
    healthcheck:
      test: "bash utils/check_celery.sh heavy"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      - postgresql
      - redis
    networks:
      - net

  celery-beat:
    image: xadmin-server
    container_name: xadmin-celery-beat
    hostname: xadmin-celery-beat
    build:
      context: .
      dockerfile: Dockerfile-dev
      args: *xadmin-build-args
    ulimits:
      core: 0
    restart: always
    # 单例声明：beat 是全局调度器，多副本会重复投递周期任务
    # （django_celery_beat 的 DatabaseScheduler 不做跨进程互斥）。声明 1 副本，
    # 横向扩展时只扩 server / celery-worker / celery-heavy（见 docs/ops/scale-out.md）。
    deploy:
      replicas: 1
    command: start beat
    environment: *xadmin-app-env
    volumes:
      - ./:/data/xadmin-server
    #      - ${VOLUME_DIR:-.}/server/data:/data/xadmin-server/data
    healthcheck:
      test: "pgrep -f 'celery.*beat'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      - postgresql
      - redis
    networks:
      - net