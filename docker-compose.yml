networks:
  net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.196.0/24

services:
  nginx:
    image: registry.cn-beijing.aliyuncs.com/nineaiyu/nginx:1.24-bullseye
    container_name: xadmin-nginx
    restart: always
    volumes:
      - ./utils/nginx.conf:/etc/nginx/nginx.conf:r
      - ./data/logs:/var/log/nginx
    ports:
      - "8896:8896"
    networks:
      - net

  postgresql:
    image: registry.cn-beijing.aliyuncs.com/nineaiyu/postgres:16.8
    container_name: xadmin-postgresql
    restart: always
    # PERF-3：8000 远超应用实际需求（CONN_MAX_AGE 持久连接 × worker 数），
    # 仅徒增 PG 内存基线；确需更高并发时引入 pgbouncer（见 ADR-005 同类预案）
    command: [ "postgres","-c","max_connections=200" ]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: ${DB_DATABASE:-xadmin}
      POSTGRES_USER: ${DB_USER:-server}
      # 密码以 config.yml 为唯一定义处，兜底值与既有部署对齐（config.yml 修改时同步）；
      # 公开分发镜像前改为 ${DB_PASSWORD:?} 强制注入（DEP-5 触发条件）
      POSTGRES_PASSWORD: ${DB_PASSWORD:-KGzKjZpWBp4R4RSa}
    volumes:
      - ${VOLUME_DIR:-../}/xadmin-postgresql/data:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -q -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - net

  redis:
    image: registry.cn-beijing.aliyuncs.com/nineaiyu/redis:7.4.3
    container_name: xadmin-redis
    hostname: xadmin-redis
    restart: always
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-nineven}", "--port", "${REDIS_PORT:-6379}" ]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-nineven}
    volumes:
      - ${VOLUME_DIR:-../}/xadmin-redis/data:/data
    healthcheck:
      test: "redis-cli -h 127.0.0.1 -p $$REDIS_PORT -a $$REDIS_PASSWORD info Replication"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - net

  db-backup:
    image: registry.cn-beijing.aliyuncs.com/nineaiyu/postgres:16.8
    container_name: xadmin-db-backup
    restart: always
    entrypoint: [ "bash", "/utils/db_backup.sh" ]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PGHOST: postgresql
      PGPORT: 5432
      PGUSER: ${DB_USER:-server}
      PGPASSWORD: ${DB_PASSWORD:-KGzKjZpWBp4R4RSa}
      PGDATABASE: ${DB_DATABASE:-xadmin}
      BACKUP_DIR: /backups
      KEEP_DAYS: 7
      BACKUP_INTERVAL: 86400
    volumes:
      - ./utils/db_backup.sh:/utils/db_backup.sh:ro
      - ${VOLUME_DIR:-../}/xadmin-db-backups:/backups
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - net

  server:
    image: xadmin-server
    container_name: xadmin-server
    hostname: xadmin-server
    build:
      context: .
      dockerfile: Dockerfile-dev
    ulimits:
      core: 0
    restart: always
    command: start web
    volumes:
      - ./:/data/xadmin-server
    #      - ${VOLUME_DIR:-.}/server/data:/data/xadmin-server/data
    healthcheck:
      test: "curl -fsL http://localhost:8896/api/common/api/health > /dev/null"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      - nginx
      - postgresql
      - redis
    networks:
      - net

  celery-worker:
    image: xadmin-server
    container_name: xadmin-celery-worker
    hostname: xadmin-celery-worker
    build:
      context: .
      dockerfile: Dockerfile-dev
    ulimits:
      core: 0
    restart: always
    command: start celery_default
    volumes:
      - ./:/data/xadmin-server
    #      - ${VOLUME_DIR:-.}/server/data:/data/xadmin-server/data
    healthcheck:
      test: "bash utils/check_celery.sh celery"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      - postgresql
      - redis
    networks:
      - net

  celery-heavy:
    image: xadmin-server
    container_name: xadmin-celery-heavy
    hostname: xadmin-celery-heavy
    build:
      context: .
      dockerfile: Dockerfile-dev
    ulimits:
      core: 0
    restart: always
    command: start celery_heavy
    volumes:
      - ./:/data/xadmin-server
    #      - ${VOLUME_DIR:-.}/server/data:/data/xadmin-server/data
    healthcheck:
      test: "bash utils/check_celery.sh heavy"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      - postgresql
      - redis
    networks:
      - net

  celery-beat:
    image: xadmin-server
    container_name: xadmin-celery-beat
    hostname: xadmin-celery-beat
    build:
      context: .
      dockerfile: Dockerfile-dev
    ulimits:
      core: 0
    restart: always
    command: start beat
    volumes:
      - ./:/data/xadmin-server
    #      - ${VOLUME_DIR:-.}/server/data:/data/xadmin-server/data
    healthcheck:
      test: "pgrep -f 'celery.*beat'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      - postgresql
      - redis
    networks:
      - net