# 构建参数（可用环境变量覆盖，无需改本文件）：
#   PIP_MIRROR=https://pypi.tuna.tsinghua.edu.cn/simple docker compose build
#   UV_CONCURRENT_DOWNLOADS=8 docker compose build      # 镜像源按 IP 限流时调小，总吞吐反而更高
x-build-args: &xadmin-build-args
  PIP_MIRROR: ${PIP_MIRROR:-https://mirrors.aliyun.com/pypi/simple}
  APT_MIRROR: ${APT_MIRROR:-http://mirrors.aliyun.com}
  UV_CONCURRENT_DOWNLOADS: ${UV_CONCURRENT_DOWNLOADS:-50}

networks:
  net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.196.0/24

services:
  nginx:
    image: registry.cn-beijing.aliyuncs.com/nineaiyu/nginx:1.31.5-alpine
    container_name: xadmin-nginx
    restart: always
    volumes:
      - ./utils/nginx.conf:/etc/nginx/nginx.conf:r
      - ./data/logs:/var/log/nginx
    ports:
      - "8896:8896"
    networks:
      - net

  postgresql:
    image: registry.cn-beijing.aliyuncs.com/nineaiyu/postgres:17.11
    container_name: xadmin-postgresql
    restart: always
    # 8000 远超应用实际需求（CONN_MAX_AGE 持久连接 × worker 数），
    # 仅徒增 PG 内存基线；确需更高并发时引入 pgbouncer（同类预案见 docs/adr）
    # PITR（2026-09-16 启用，见 docs/ops/pitr.md）：
    #   - archive_mode=on 需重启生效（archive_command/timeout 可 reload）；
    #   - 归档用 gzip 压缩（空段 16MB → KB 级，磁盘成本≈0），restore 端 gunzip；
    #   - 归档卷当前与数据同盘（单机退让，风险与迁移条件见 pitr.md §6），
    #     有独立盘后把宿主路径换成挂载点即可（容器内路径不变）
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60
      - -c
      - "archive_command=test ! -f /var/lib/postgresql/archive/%f.gz && gzip < %p > /var/lib/postgresql/archive/%f.gz"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: ${DB_DATABASE:-xadmin}
      POSTGRES_USER: ${DB_USER:-server}
      # 密码以 config.yml 为唯一定义处，兜底值与既有部署对齐（config.yml 修改时同步）；
      # 公开分发镜像前改为 ${DB_PASSWORD:?} 强制注入（触发条件）
      POSTGRES_PASSWORD: ${DB_PASSWORD:-KGzKjZpWBp4R4RSa}
    volumes:
      - ${VOLUME_DIR:-../}/xadmin-postgresql/data:/var/lib/postgresql/data
      - ${VOLUME_DIR:-../}/xadmin-postgresql/archive:/var/lib/postgresql/archive
    healthcheck:
      test: "pg_isready -q -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - net

  redis:
    image: registry.cn-beijing.aliyuncs.com/nineaiyu/redis:7.4.11
    container_name: xadmin-redis
    hostname: xadmin-redis
    restart: always
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-nineven}", "--port", "${REDIS_PORT:-6379}" ]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-nineven}
    volumes:
      - ${VOLUME_DIR:-../}/xadmin-redis/data:/data
    healthcheck:
      test: "redis-cli -h 127.0.0.1 -p $$REDIS_PORT -a $$REDIS_PASSWORD info Replication"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - net

  db-backup:
    image: registry.cn-beijing.aliyuncs.com/nineaiyu/postgres:17.11
    container_name: xadmin-db-backup
    restart: always
    entrypoint: [ "bash", "/utils/db_backup.sh" ]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PGHOST: postgresql
      PGPORT: 5432
      PGUSER: ${DB_USER:-server}
      PGPASSWORD: ${DB_PASSWORD:-KGzKjZpWBp4R4RSa}
      PGDATABASE: ${DB_DATABASE:-xadmin}
      BACKUP_DIR: /backups
      KEEP_DAYS: 7
      # RPO 目标 6h（21600s，原 24h）；仍需更短窗口则走 WAL 归档/PITR（独立立项）
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-21600}
      # 媒体目录入备份（只读挂载 ./data/upload）
      BACKUP_MEDIA: ${BACKUP_MEDIA:-true}
      MEDIA_DIR: /media
      # 异地副本。local=挂载第二块盘/NFS；rsync=远端主机；rclone=云对象存储。
      # 留空表示未启用（脚本跳过同步，仅本地保留）
      BACKUP_REMOTE_TYPE: ${BACKUP_REMOTE_TYPE:-}
      BACKUP_REMOTE_TARGET: ${BACKUP_REMOTE_TARGET:-}
      BACKUP_REMOTE_KEEP_DAYS: ${BACKUP_REMOTE_KEEP_DAYS:-7}
    volumes:
      - ./utils/db_backup.sh:/utils/db_backup.sh:ro
      - ./data/upload:/media:ro
      - ${VOLUME_DIR:-../}/xadmin-db-backups:/backups
      # local 异地副本的目标挂载点（BACKUP_REMOTE_TYPE=local 时容器写入此目录）。
      # 生产应指向独立磁盘/NFS，而非与源库同盘的目录
      - ${VOLUME_DIR:-../}/xadmin-db-backups-remote:/remote
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - net

  server:
    image: xadmin-server
    container_name: xadmin-server
    hostname: xadmin-server
    build:
      context: .
      dockerfile: Dockerfile-dev
      args: *xadmin-build-args
    ulimits:
      core: 0
    restart: always
    command: start web
    volumes:
      - ./:/data/xadmin-server
    #      - ${VOLUME_DIR:-.}/server/data:/data/xadmin-server/data
    healthcheck:
      test: "curl -fsL http://localhost:8896/api/common/api/health > /dev/null"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      - nginx
      - postgresql
      - redis
    networks:
      - net

  celery-worker:
    image: xadmin-server
    container_name: xadmin-celery-worker
    hostname: xadmin-celery-worker
    build:
      context: .
      dockerfile: Dockerfile-dev
      args: *xadmin-build-args
    ulimits:
      core: 0
    restart: always
    command: start celery_default
    volumes:
      - ./:/data/xadmin-server
    #      - ${VOLUME_DIR:-.}/server/data:/data/xadmin-server/data
    healthcheck:
      test: "bash utils/check_celery.sh celery"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      - postgresql
      - redis
    networks:
      - net

  celery-heavy:
    image: xadmin-server
    container_name: xadmin-celery-heavy
    hostname: xadmin-celery-heavy
    build:
      context: .
      dockerfile: Dockerfile-dev
      args: *xadmin-build-args
    ulimits:
      core: 0
    restart: always
    command: start celery_heavy
    volumes:
      - ./:/data/xadmin-server
    #      - ${VOLUME_DIR:-.}/server/data:/data/xadmin-server/data
    healthcheck:
      test: "bash utils/check_celery.sh heavy"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      - postgresql
      - redis
    networks:
      - net

  celery-beat:
    image: xadmin-server
    container_name: xadmin-celery-beat
    hostname: xadmin-celery-beat
    build:
      context: .
      dockerfile: Dockerfile-dev
      args: *xadmin-build-args
    ulimits:
      core: 0
    restart: always
    command: start beat
    volumes:
      - ./:/data/xadmin-server
    #      - ${VOLUME_DIR:-.}/server/data:/data/xadmin-server/data
    healthcheck:
      test: "pgrep -f 'celery.*beat'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      - postgresql
      - redis
    networks:
      - net