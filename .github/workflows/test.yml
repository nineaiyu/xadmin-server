name: Unit Tests

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    # 时长预算 ≤ 20 min（容器启动 + uv sync 占大头，pytest 本体真库实测分钟级）；
    # 2 次尝试 × 8 min + 环境准备 ≈ 19 min，仍在预算内
    timeout-minutes: 20

    services:
      postgres:
        # 真环境门禁（全真容器化测试迁移方案 §3.3 / §四 阶段 3）：大版本与生产/loadtest 对齐
        # （同 test-nightly-pg.yml），方言/连接池/pk 序列类缺陷在 PR 阶段暴露而非逃逸到生产
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: server
          POSTGRES_PASSWORD: pgtest
          POSTGRES_DB: xadmin_realtest
        ports:
          - 55433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        # 真 Redis（生产同款 django_redis backend 与 channel layer），同 perf.yml 既有形态
        image: redis:8.10.2
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # 真环境档为 pytest.ini 缺省（sqlite 从测试链路退役）；此处显式注入
      # 使 check 步骤同档。DB_DATABASE 用 settings_real 缺省 xadmin_realtest（与
      # POSTGRES_DB 对齐）；xdist 下 settings_real 按 worker 自动加后缀，各 worker
      # 独立建 test_<库名> 并跑迁移。Redis 服务的 xdist 隔离（db 编号 + 键前缀）
      # 见 tests/settings_real.py 模块 docstring
      DJANGO_SETTINGS_MODULE: tests.settings_real
      DB_HOST: 127.0.0.1
      DB_PORT: "55433"
      DB_USER: server
      DB_PASSWORD: pgtest
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "56379"
      # CI 的 redis 服务不设密码，settings_real 缺省 REDIS_PASSWORD=""（同 perf.yml 口径）

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        # 版本由 pyproject.toml 的 [tool.uv].required-version 决定；缓存按 uv.lock 命中
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        # 以 uv.lock 为唯一安装依据（requirements*.txt 仅用于 pip-audit 与手工安装）；
        # psycopg3/psycopg-pool 已在依赖内。MySQL 档维持 ADR 触发制，mysqlclient 不参与编译
        run: uv sync --locked --no-install-package mysqlclient

      - name: Verify lockfile is in sync
        # 容器构建走 uv pip + 镜像源（不经 lock 的 URL，见 Dockerfile-base 说明），
        # lock ↔ pyproject 的一致性校验在此补齐
        run: uv lock --check

      - name: Compile i18n catalogs (django.mo)
        # .mo 为 gitignore 项（不随仓库分发），CI 检出后没有编译产物；不编译则
        # gettext 对全部 msgid 回退英文，断言中文文案的测试（如超管删除 400 文案）
        # 必然失败。与生产镜像构建期编译（Dockerfile）同口径。
        # runner 未预装 gettext（msgfmt），先装。
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext
          uv run --no-sync python manage.py compilemessages

      - name: Run tests (parallel, real PostgreSQL + Redis)
        # 口径不变：-n auto + --cov-fail-under=85（2026-09-18 上调 82 → 85）。
        #
        # 假死自愈 + 现场取证（2026-10-20）：
        #   现场：进度线在 92% 处断流 17~30 分钟后「一次性爆发 3~5 行」，PG 侧零写入，
        #   主进程停在 xdist dsession 等待事件（worker 不再上报）；本机同命令 2~5 分钟
        #   稳定通过。faulthandler 的按用例看门狗不触发，说明卡点在用例之外（fixture /
        #   worker 内部等待）。
        # 处理：
        #   1) pytest 输出写文件（不再经 stdout 管道），每分钟回显一行进度；
        #   2) 后台看门狗：连续 240s 日志无增长即判定假死，对 pytest 主进程与全部 worker
        #      发 SIGABRT，由 faulthandler 把所有线程栈写入日志，再结束本次尝试 —— 下一次
        #      红灯直接带卡点栈，不再靠猜；
        #   3) 单次尝试 8 分钟硬上限（正常 2~3 分钟），假死/超时自动重试一次；
        #      真失败（断言/覆盖率）原样退出不重试；完整日志与 junit 一并作为 artifact 上传。
        run: |
          mkdir -p test-reports
          LOG=test-reports/pytest.log
          for attempt in 1 2; do
            echo "=== pytest attempt ${attempt} ==="
            rm -f "$LOG" "$LOG.done" "$LOG.stalled"
            timeout --signal=INT --kill-after=60 8m \
              uv run --no-sync pytest -n auto --cov --cov-report=term-missing --cov-fail-under=85 \
                --junitxml="test-reports/junit-${attempt}.xml" > "$LOG" 2>&1 &
            TPID=$!
            (
              last=0; idle=0
              while [ ! -f "$LOG.done" ]; do
                sleep 30
                [ -f "$LOG.done" ] && break
                cur=$(stat -c %s "$LOG" 2>/dev/null || echo 0)
                if [ "$cur" -eq "$last" ]; then idle=$((idle + 30)); else idle=0; last=$cur; fi
                printf '  [watch] 进度行 %s，静默 %ss，末尾：%s\n' \
                  "$(grep -c '%]' "$LOG" 2>/dev/null || echo 0)" "$idle" \
                  "$(tail -c 160 "$LOG" 2>/dev/null | tr '\n' ' ')"
                if [ "$idle" -ge 240 ] && [ ! -f "$LOG.stalled" ]; then
                  echo "!!! 连续 ${idle}s 无输出，判定假死：转储线程栈 !!!" | tee -a "$LOG"
                  touch "$LOG.stalled"
                  # uv run 会再套一层：直接按命令行找 pytest 主进程，再取其 worker 子进程
                  PY=$(pgrep -f "pytest -n auto" | head -1)
                  for w in $(pgrep -P "$PY"); do kill -ABRT "$w" 2>/dev/null; done
                  sleep 4
                  kill -ABRT "$PY" 2>/dev/null
                  sleep 3
                  kill -TERM "$TPID" 2>/dev/null
                fi
              done
            ) &
            WATCH=$!
            wait "$TPID"
            code=$?
            touch "$LOG.done"
            wait "$WATCH" 2>/dev/null || true
            echo "--- pytest 输出尾部（attempt ${attempt}, exit ${code}）---"
            # 卡点栈可能很长：完整日志随 artifact 上传，这里回显尾部 300 行
            tail -n 300 "$LOG"
            [ "$code" -eq 0 ] && exit 0
            if [ -f "$LOG.stalled" ] || [ "$code" -eq 124 ]; then
              echo "pytest 假死或超时（已转储卡点栈），重试…" >&2
              continue
            fi
            echo "pytest failed with exit ${code}（真失败，不重试）" >&2
            exit "$code"
          done
          echo "pytest 连续两次假死/超时" >&2
          exit 124

      - name: Upload test report (junit)
        # 失败也上传：junit 逐用例结果供定位（无重试，失败即真失败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: |
            test-reports/junit-1.xml
            test-reports/junit-2.xml
            test-reports/pytest.log
          if-no-files-found: warn
          retention-days: 7

      - name: Django system checks (database-tagged, real PostgreSQL)
        # 守护「启动即炸」类缺陷：索引名超长（models.E034）/ GinIndex 缺
        # django.contrib.postgres（postgres.E005）等模型检查仅在 `check --database`
        # 运行时执行（普通 check 不跑）。真库执行（方案 §3.3）：PG 专属模型检查
        # 覆盖更强；settings 由 job env 继承（tests.settings_real）
        run: uv run --no-sync python manage.py check --database default

      # 代码风格检查由 lint.yml 独立负责，此处不再重复执行 ruff
