name: Unit Tests

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        # 版本由 pyproject.toml 的 [tool.uv].required-version 决定；缓存按 uv.lock 命中
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        # 以 uv.lock 为唯一安装依据（requirements*.txt 仅用于 pip-audit 与手工安装）；
        # 测试环境使用 sqlite3，无需编译 mysqlclient
        run: uv sync --locked --no-install-package mysqlclient

      - name: Verify lockfile is in sync
        # 容器构建用 --frozen（镜像源候选集与 PyPI 不一致时 --locked 会误报），
        # lock ↔ pyproject 的一致性校验在此补齐
        run: uv lock --check

      - name: Run tests (parallel)
        # -n auto 并行（sqlite 内存库每 worker 独立、FakeRedis 进程内无交叉污染）
        # --cov-fail-under=85 覆盖率门禁：2026-09-18 上调 82 → 85（实测 87%，满足
        # ≤ 实测 -2pp 上移规则；Q1 阶段二目标提前达成），关键模块另行按模块跟踪
        run: uv run --no-sync pytest -n auto --cov --cov-report=term-missing --cov-fail-under=85

      - name: Django system checks (database-tagged)
        # 守护「启动即炸」类缺陷：索引名超长（models.E034）/ GinIndex 缺
        # django.contrib.postgres（postgres.E005）等模型检查仅在 `check --database`
        # 运行时执行（普通 check 不跑）——2026-09-18 部署实测曾因此卡死 manage.py start，
        # CI 此前无覆盖。sqlite 内存库即可承载该检查（与数据库后端无关）。
        run: DJANGO_SETTINGS_MODULE=tests.settings_test uv run --no-sync python manage.py check --database default

      # 代码风格检查由 lint.yml 独立负责，此处不再重复执行 ruff