name: Lint Code

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run ruff check
        run: ruff check .

  cross-app-imports:
    name: Cross-app import gate (T2.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check cross-app direct imports
        run: python scripts/check_cross_app_imports.py

  file-length:
    name: File length gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check oversized source files
        # 防巨型文件回潮：>500 行新增即失败；存量基线只减不增
        run: python scripts/check_file_length.py