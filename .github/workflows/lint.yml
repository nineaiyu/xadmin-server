name: Lint Code

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        # ruff 版本取自 uv.lock 的 dev 组，与本地一致（避免 CI 拉到更新版本引入未同步的新规则）
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install ruff
        run: uv sync --locked --only-group dev

      - name: Run ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Run ruff check
        run: uv run --no-sync ruff check .

  cross-app-imports:
    name: Cross-app import gate (T2.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check cross-app direct imports
        run: python scripts/check_cross_app_imports.py

  menu-permissions:
    name: Menu permission reconcile gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        name: Checkout client repo (consumer side)
        with:
          repository: nineaiyu/xadmin-client
          ref: dev
          path: xadmin-client

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reconcile menu.json permission points with frontend consumption
        # 种子权限点 ↔ 前端消费点双向对账（白名单与例外登记见 docs/guide/menu-maintenance.md §5）；
        # 脚本归前端仓维护，此处就地执行：菜单种子改动在服务端 PR 阶段即暴露漂移
        working-directory: xadmin-client
        env:
          XADMIN_SERVER_DIR: ${{ github.workspace }}
        run: node scripts/check-menu-permissions.mjs

  mypy:
    name: Type check (mypy, common 内核)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        # mypy 版本取自 uv.lock 的 dev 组，与本地一致（口径见 pyproject [tool.mypy]）
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dev dependencies
        # 全量安装（主依赖 + dev 组）：mypy 依据环境里实际安装的包推导类型，缺包会被
        # ignore_missing_imports 吞成 Any——dev-only 环境与本地完整 venv 会对同一行代码
        # 给出相反判定（ignore 一侧必需、另一侧 unused-ignore）。mysqlclient 需系统库
        # 编译且无内联类型，跳过不影响检查口径（与 test.yml 同参）
        run: uv sync --locked --no-install-package mysqlclient

      - name: Run mypy
        # 增量收口模式：受检范围与存量豁免清单见 pyproject [tool.mypy]（豁免只减不增）
        run: uv run --no-sync mypy

  file-length:
    name: File length gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check oversized source files
        # 防巨型文件回潮：>500 行新增即失败；存量基线只减不增
        run: python scripts/check_file_length.py

  doc-facts:
    name: Doc facts gate (G4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check doc facts against code sources
        # 文档单一事实源防漂移：「当前状态」版本串必须与 requirements.txt / server/const.py /
        # workflows / client package.json 一致（跨仓事实在单仓检出时自动跳过）
        run: python scripts/check_doc_facts.py

      - name: Check doc index coverage
        # 防孤儿文档：docs/ 下的内容型文档必须登记到索引（docs/README.md 或同目录 README.md）
        run: python scripts/check_doc_index.py

      - name: Check doc path references
        # 组件手册 + 活跃开发文档引用的代码路径必须可达（跨仓未检出时自动跳过）
        run: python scripts/check_doc_paths.py

      - name: Check tutorial mirror
        # 教程里的 manage.py 命令 / CLI 参数 / demo 路径必须与代码一致
        run: python scripts/check_tutorial_mirror.py