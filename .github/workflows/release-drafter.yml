name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 完整历史与标签：后续按上一 tag 到本 tag 的区间汇总提交
          fetch-depth: 0
          fetch-tags: true

      - name: Get version
        id: get_version
        run: |
          TAG=$(basename ${GITHUB_REF})
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          wget https://raw.githubusercontent.com/nineaiyu/xadmin-installer/master/quick_start.sh
          VERSION=${TAG/v/}
          echo "TAG=${VERSION}" >> $GITHUB_ENV
          sed -i "s@VERSION=.*@VERSION=v${VERSION}@g" quick_start.sh

      - name: Create Release
        id: create_release
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          publish: true
          config-name: release-config.yml
          version: ${{ steps.get_version.outputs.TAG }}
          tag: ${{ steps.get_version.outputs.TAG }}

      - name: Sleep time
        run: |
          sleep 2

      - name: Release Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            quick_start.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release-drafter 只汇总 PR：本项目以直接推送主干为主，若不补齐，Release
      # 会把数百个提交显示成几条。此处按上一 tag 到本 tag 的区间重建「版本变化」段
      - name: Sync full commit changelog into release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_version.outputs.TAG }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            echo "首次发布（无前置 tag），跳过变更同步"
            exit 0
          fi
          python3 scripts/sync_release_notes.py "$PREV_TAG" "$TAG"