name: Build and Push Image

on:
  push:
    tags:
      - 'v*'

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout server repository
        uses: actions/checkout@v4

      - name: Checkout client repository
        uses: actions/checkout@v4
        with:
          repository: nineaiyu/xadmin-client
          path: xadmin-client

      - name: Check version consistency with client
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CLIENT_VERSION=$(python3 -c "import json; print(json.load(open('xadmin-client/package.json'))['version'])")
          echo "server tag: $TAG_VERSION, client version: $CLIENT_VERSION"
          if [ "$TAG_VERSION" != "$CLIENT_VERSION" ]; then
            echo "::error::前后端版本不一致：server tag v$TAG_VERSION vs client $CLIENT_VERSION，请同步升版后再发布"
            exit 1
          fi

  build-and-push-image:
    needs: check-version
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract repository name
        id: repo
        run: echo "REPO=$(basename ${{ github.repository }})" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: nineaiyu/${{ env.REPO }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          build-args: VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          file: Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
