name: Build and Push Image

on:
  push:
    tags:
      - 'v*'
  # 手动重跑入口：tag 事件偶发不触发（删建同名 tag 会被事件系统合并）时，
  # 用 gh workflow run "Build and Push Image" --ref <tag> 补跑
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout server repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout client repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: nineaiyu/xadmin-client
          path: xadmin-client

      - name: Check version consistency with client
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SERVER_VERSION=$(python3 -c "import re; print(re.search(r'^VERSION\s*=\s*\"([^\"]+)\"', open('server/const.py').read(), re.M).group(1))")
          CLIENT_VERSION=$(python3 -c "import json; print(json.load(open('xadmin-client/package.json'))['version'])")
          echo "server tag: $TAG_VERSION, server const.py: $SERVER_VERSION, client version: $CLIENT_VERSION"
          if [ "$TAG_VERSION" != "$CLIENT_VERSION" ]; then
            echo "::error::前后端版本不一致：server tag v$TAG_VERSION vs client $CLIENT_VERSION，请同步升版后再发布"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$SERVER_VERSION" ]; then
            echo "::error::发布 tag 与 server/const.py 不一致：tag v$TAG_VERSION vs const.py $SERVER_VERSION，请同步后再发布"
            exit 1
          fi

  # 按需诊断 job（仅 workflow_dispatch 触发）：打印镜像内包元数据分布，
  # 用于定位镜像扫描报告的来源（聚合 target 不携带文件路径时使用）
  inspect-scan-image:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          load: true
          tags: xadmin-server:inspect
          build-args: VERSION=inspect

      - name: Inspect package metadata sources
        run: |
          docker run --rm --entrypoint sh xadmin-server:inspect -c '
            echo "=== setuptools named paths ==="
            find / -xdev -maxdepth 9 -iname "setuptools*" 2>/dev/null | head -40
            echo "=== METADATA/PKG-INFO declaring setuptools ==="
            find / -xdev -maxdepth 9 \( -name METADATA -o -name PKG-INFO \) 2>/dev/null \
              | xargs grep -l "^Name: setuptools" 2>/dev/null | head -20
            echo "=== site-packages roots ==="
            ls -d /usr/local/lib/python3*/site-packages /usr/lib/python3*/site-packages /data/py3/lib/python3*/site-packages 2>/dev/null
            echo "=== dist-info under each root (setuptools/setuptools-like) ==="
            for d in /usr/local/lib/python3*/site-packages /usr/lib/python3*/site-packages /data/py3/lib/python3*/site-packages; do
              echo "--- $d"
              ls "$d" 2>/dev/null | grep -iE "setuptools|pkg_resources|egg-info" | head -20
            done
          '

  security-scan:
    needs: check-version
    runs-on: ubuntu-latest
    # OpenAPI 导出会触达数据库（filterset choices / LabeledChoiceField 查库），
    # 与 test.yml 同构的真 PG service + migrate 后生成，避免无库环境连不上
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: server
          POSTGRES_PASSWORD: pgtest
          POSTGRES_DB: xadmin_realtest
        ports:
          - 55433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.8'

      - name: Install uv
        # 版本由 pyproject.toml 的 [tool.uv].required-version 决定；缓存按 uv.lock 命中
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install dependencies
        # 依赖以 uv.lock 安装；pip-audit 走 requirements.txt（审计格式，见 README 依赖管理）
        run: |
          uv sync --locked
          pip install pip-audit

      # 依赖高危门禁：存量已于 2026-09-07 清零（45→0），移除 `|| true` 切为发布阻断。
      # pip-audit 发现任一已知漏洞即非零退出，阻断后续 build-and-push-image
      - name: Generate SBOM (CycloneDX) and dependency audit
        # mkdir -p：新版 pip-audit 不再自动创建输出父目录，缺 sbom/ 时写文件直接 FileNotFound
        run: |
          mkdir -p sbom
          pip-audit -f cyclonedx-json -o sbom/sbom-server.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-server
          path: sbom/sbom-server.cdx.json

      # 静态 OpenAPI 随版本发布：最小 config.yml（DEBUG=false 时 ALLOWED_HOSTS 必填），
      # 指向 service 容器 PG；SECRET_KEY 仅为通过拒启校验
      - name: Prepare CI database
        run: |
          printf "ALLOWED_HOSTS: ['ci-openapi-export']\nDB_HOST: 127.0.0.1\nDB_PORT: 55433\nDB_USER: server\nDB_PASSWORD: pgtest\nDB_DATABASE: xadmin_realtest\n" > config.yml
          SECRET_KEY=ci-openapi-export uv run --no-sync python manage.py migrate --no-input

      - name: Export OpenAPI schema
        run: |
          mkdir -p openapi
          SECRET_KEY=ci-openapi-export uv run --no-sync python manage.py spectacular --file openapi/openapi.json --format openapi-json

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi-server
          path: openapi/openapi.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image for scan (single arch)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          load: true
          build-args: VERSION=${{ github.ref_name }}
          tags: xadmin-server:scan

      # 高危/严重漏洞阻断发布。误报表经 .trivyignore.yaml 结构化豁免
      # （--skip-files 仅作用于文件遍历器，对镜像内的 secret 检测不生效）
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: xadmin-server:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

  build-and-push-image:
    needs: [ check-version, security-scan ]
    runs-on: ubuntu-latest
    # id-token / attestations 供镜像构建溯源签发；contents 供上传 Release 附件
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract repository name
        id: repo
        run: echo "REPO=$(basename ${{ github.repository }})" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: nineaiyu/${{ env.REPO }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          build-args: VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          file: Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 关闭镜像内的构建溯源附件（OCI 1.1 artifact，config 为
          # application/vnd.oci.empty.v1+json）：下游镜像源（阿里云仓）不支持该 manifest
          # class，带上它会导致该版本镜像无法从 Docker Hub 同步过去。构建溯源仍由下方
          # attest-build-provenance 步骤在 GitHub 侧签发（与镜像内附件无关）。
          provenance: false

      # 多架构推送时 digest 即镜像索引（manifest list）摘要，作为构建溯源主体
      - name: Attest image build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: nineaiyu/xadmin-server
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Download SBOM artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom-server
          path: sbom

      - name: Download OpenAPI artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openapi-server
          path: openapi

      - name: Upload SBOM and OpenAPI to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            sbom/sbom-server.cdx.json
            openapi/openapi.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
