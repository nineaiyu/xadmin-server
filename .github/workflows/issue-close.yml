name: Issue Close Check

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  issue-close-remove-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Remove pending labels
        if: ${{ !github.event.issue.pull_request }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          number="${{ github.event.issue.number }}"
          labels=$(gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          for label in "🔔 Pending processing" "⏳ Pending feedback"; do
            # 幂等：仅移除实际存在的标签
            if grep -qxF "$label" <<<"$labels"; then
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --remove-label "$label"
            fi
          done
