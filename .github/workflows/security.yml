name: Security Audit

on:
  schedule:
    - cron: '0 3 * * 1'
  # PR 阶段也跑：避免带已知漏洞的依赖随合并进入主干，直到下周一才暴露
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
