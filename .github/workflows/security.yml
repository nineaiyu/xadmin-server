name: Security Audit

on:
  schedule:
    - cron: '0 3 * * 1'
  # PR 阶段也跑：避免带已知漏洞的依赖随合并进入主干，直到下周一才暴露
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.8'

      - name: Run pip-audit
        run: |
          pip install pip-audit
          # CVE-2026-106454：twisted 26.4.0 的已知漏洞，上游尚未发布修复版本
          # （advisory 无 Fix Versions）；twisted 由 daphne 引入，无法通过升级消除。
          # 待上游修复后移除本豁免（2027-01 复查）。
          pip-audit -r requirements.txt --ignore-vuln CVE-2026-106454
