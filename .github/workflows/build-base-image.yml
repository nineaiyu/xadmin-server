name: Build and Push Base Image

on:
  push:
    branches:
      - 'main'
      - 'dev'
    paths:
      - 'uv.lock'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'Dockerfile-base'
      # 工作流自身变更也触发一次，验证构建与回写逻辑
      - '.github/workflows/build-base-image.yml'
  workflow_dispatch:

jobs:
  build-and-push-base-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 回写 base tag 需完整历史：构建期间分支可能前进，需 pull --rebase 后重试
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract date
        id: vars
        run: echo "IMAGE_TAG=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV

      - name: Extract repository name
        id: repo
        run: echo "REPO=$(basename ${{ github.repository }})" >> $GITHUB_ENV

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          file: Dockerfile-base
          tags: nineaiyu/${{ env.REPO }}-base:${{ env.IMAGE_TAG }}

      - name: Update Dockerfile
        run: |
          sed -i 's@nineaiyu/.* AS stage-build@nineaiyu/${{ env.REPO }}-base:${{ env.IMAGE_TAG }} AS stage-build@' Dockerfile

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Dockerfile
          git commit -m "perf: Update Dockerfile with new base image tag"
          # 构建耗时数分钟，期间分支可能已有新提交（直接 push 会被拒）：
          # 逐次 rebase 后重试；三次仍失败则显式报错，避免静默丢弃 tag 回写。
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "第 ${attempt} 次回写失败（分支在构建期间有新提交），5 秒后重试"
            sleep 5
          done
          echo "::error::Dockerfile base tag 回写失败：分支持续有新提交，请重跑本工作流"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
