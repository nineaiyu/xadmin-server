name: Issue Open Check

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  issue-open-add-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Add pending processing label
        if: ${{ !github.event.issue.pull_request }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          number="${{ github.event.issue.number }}"
          labels=$(gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          # 幂等：已有目标标签则跳过
          if ! grep -qxF "🔔 Pending processing" <<<"$labels"; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --add-label "🔔 Pending processing"
          fi
