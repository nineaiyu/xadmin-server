# 单副本后端（默认形态）：变量式 proxy_pass 把域名解析推迟到每次建连。
#
# 为什么不用静态 upstream：静态 upstream / `proxy_pass host` 在配置加载期解析域名——
# 编排里 nginx 早于 server 容器启动时会 [emerg] host not found in upstream "server:8896"
# 直接启动失败（只能靠 restart: always 反复重试兜底）；且解析结果启动后固定，server
# 容器重建换 IP 后必须手工 restart nginx 才恢复转发。
#
# 多副本（需要上游轮询与 zone 内的运行期重解析）改用 xadmin-backend.multi.conf，
# 由 docker-compose.scale.yml 覆盖挂载；两个文件只差本段内容。
server {
    listen 8896;
    set $xadmin_api_backend server:8896;
    proxy_pass $xadmin_api_backend;
}
