
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

stream {
    log_format  proxy  '$remote_addr [$time_local] '
                       '$protocol $status $bytes_sent $bytes_received '
                       '$session_time "$upstream_addr" '
                       '"$upstream_bytes_sent" "$upstream_bytes_received" "$upstream_connect_time"';

    access_log /var/log/nginx/tcp-access.log  proxy;

    open_log_file_cache off;

    # 后端地址运行期解析（勿改回 upstream 静态写法）：
    # - 静态 upstream / `proxy_pass host` 在 nginx 配置加载期解析域名：编排里 nginx 早于
    #   server 启动时会 [emerg] host not found in upstream "server:8896" 直接启动失败
    #   （只能靠 restart: always 反复重试兜底）；且解析结果启动后固定，server 容器重建
    #   换 IP 后必须手工 restart nginx 才恢复转发。
    # - 变量 proxy_pass 把解析推迟到每次建连：127.0.0.11 = Docker 内嵌 DNS；
    #   valid=10s 短缓存兼顾开销与「server 容器换 IP 后自动跟随」。
    # - 原 upstream 的 hash/max_fails 为多后端预设，单后端无行为差异；将来多实例请改用
    #   nginx 1.27.3+ 的 `server server:8896 resolve` + zone 保留 upstream 能力。
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8896;
        set $xadmin_api_backend server:8896;
        proxy_pass $xadmin_api_backend;
    }
}

