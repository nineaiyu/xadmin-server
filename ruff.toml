# Ruff 配置：启用 E/F 错误级规则；存量通配 import 文件在 per-file-ignores 中显式列出，新代码不得新增
line-length = 120
target-version = "py313"
extend-exclude = ["zsign", "demo/migrations", "data", "loadjson"]

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E501", # 行长，存量代码大量超长
    "E402", # import 不在顶部，settings 模块需要先打补丁再导入
]

[lint.per-file-ignores]
"tests/**" = []
# 存量通配 import（models/settings 聚合导出与进程管理脚本），重构收敛后逐个移除
