[pytest]
# 缺省指向真环境档（全真容器化测试迁移方案 §二 G2：sqlite 已从测试链路禁用删除，
# 阶段 3/4）；PG+Redis 依赖由 compose.test.yml 或 CI services 提供，不可达时
# tests/conftest.py 预检直接 fail-fast 并给出恢复指引。
DJANGO_SETTINGS_MODULE = tests.settings_real
testpaths = tests
python_files = test_*.py
# maxprocesses 硬上限 = 真环境档 Redis 隔离的容量边界：xdist worker gwN 各占一个
# Redis 逻辑库（gwN → 1 + N%15，db0 兜底保留），≤15 worker 时每 worker 独库；
# 裸连接消费面（ReentrantLock / pending / CacheList locker 等自管键）不经过
# django cache 键前缀，跨 worker 唯一性完全依赖独库，超过 15 worker 会共库互踩
# （表现为随机用例锁语义报错/状态丢失，单跑必过）。
#
# 默认值取 8 而不是顶到 15：高核数开发机（18 核）上 worker 数越多，并发写压力越大。
# 2026-10-17 曾在内存压缩 19G + 多轮全量并发跑时把 PG checkpoint 写入拖到 270s；
# 2026-10-18 复核定因：真正造成 96% 假死的是并发 pytest 互踩测试库（资源压力只是
# 放大器，见 docs/plans/archive/全量pytest尾部假死问题移交-2026.10.md）。
# 8 worker 在健康机器上全量约 2 分钟（2026-10-18 实测 6237 passed / 107s）；
# CI 仅 4 核且显式 `-n auto`，不受本值影响。需要更快可显式 `-n 12`，上限仍是 15
# （Redis 独库约束）。
addopts = --tb=short -q --maxprocesses=8
# 并发串行化：两轮 pytest 会在 django_db_setup 里 DROP/CREATE 同名测试库，互相
# pg_terminate_backend 连接（DB CPU 打满 / Python 无 CPU / SQL 日志只有几行）。
# tests/conftest.py 用 PG 会话级 advisory lock 在 master 进程串行化整轮测试，
# 拿不到锁直接 exit；确需并发可设 XADMIN_ALLOW_CONCURRENT_PYTEST=1。
# 卡死自证：任一测试/会话超过 600s 未推进即向 stderr 转储全部线程 Python 栈后退出
# （xdist 下各 worker 独立计时）。用途是把「master 永久等 worker」类无声挂死变成
# 可定位事件——2026-10-17 全量跑到 96% 假死，当时误判为资源耗尽；2026-10-18
# 复核定因为并发 pytest 互踩测试库（资源压力是放大器）。有此项后挂死现场直接打印
# 卡在哪个文件哪一行（faulthandler 输出在 worker stderr，经 xdist 汇聚到主日志）。
# CI/健康机器上永不触发，不影响正常时长（全量约 2 分钟）。
faulthandler_timeout = 600
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
