
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

stream {
    log_format  proxy  '$remote_addr [$time_local] '
                       '$protocol $status $bytes_sent $bytes_received '
                       '$session_time "$upstream_addr" '
                       '"$upstream_bytes_sent" "$upstream_bytes_received" "$upstream_connect_time"';

    access_log /var/log/nginx/tcp-access.log  proxy;

    open_log_file_cache off;

    # Docker 内嵌 DNS：后端地址在运行期解析（勿改成配置加载期解析的静态 upstream，
    # 原因见被 include 的 xadmin-backend.conf 注释——编排里 nginx 可能早于 server 就绪）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 后端形态由 include 的文件决定（同一挂载点，切换部署形态即换文件）：
    # - ops/xadmin-backend.single.conf：单副本（默认，启动期不解析域名）；
    # - ops/xadmin-backend.multi.conf：多副本（upstream + zone + resolve）。
    # 切换方式：叠加 docker-compose.scale.yml（见 docs/ops/scale-out.md）。
    include /etc/nginx/xadmin-backend.conf;
}
