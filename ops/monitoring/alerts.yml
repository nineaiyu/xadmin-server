# 告警规则（xadmin 监控栈）：与 docs/ops/observability.md §三「SLO」表同口径。
#
# 规则只做「判定」；投递由两条路径承担（详见 docs/ops/monitoring-stack.md）：
#   ① 宿主侧 scripts/prometheus_alert_bridge.py 轮询 /api/v1/alerts，
#      把 firing 告警写进平台既有的 /api/common/api/ops-alert（站内信 + 邮件 + Webhook）；
#   ② 组织已有 Alertmanager / 云监控接 Prometheus 远端读。
groups:
  - name: xadmin-availability
    rules:
      - alert: XadminTargetDown
        expr: up{job="xadmin-app"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "xadmin 指标端点不可达（{{ $labels.instance }}）"
          description: "抓取失败超过 2 分钟：应用进程或网络异常，先看 healthz 与容器状态（docs/ops/runbook.md）。"

      - alert: XadminHealthProbeFailed
        expr: probe_success{job="xadmin-health"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "xadmin 健康探针失败（{{ $labels.instance }}）"
          description: "healthz 连续 2 分钟非 2xx：DB/Redis 依赖或应用已不可用。"

      - alert: XadminAvailabilityLow
        expr: |
          sum(rate(xadmin_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(xadmin_http_requests_total[5m])), 1) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "xadmin 5xx 率 > 1%（持续 5 分钟）"
          description: "可用性 SLO（≥ 99.5%/月）正在被消耗：查 5xx 明细与最近发布（release-checklist §0）。"

  - name: xadmin-latency
    rules:
      - alert: XadminApiLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(xadmin_http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "xadmin API P95 > 1s（持续 10 分钟）"
          description: "P95 SLO 目标 < 500ms；先看慢请求日志与 DB/Redis 指标（observability §三）。"

      # 端点级 P95 告警：阈值 = loadtest/baseline.json 基线 P95 × 3，`view` 标签精确匹配端点。
      # 口径说明（避免与 check_baseline 的 1.2x 回归门禁混淆）：
      #   - 这里的比较基准是 k6 客户端口径（含网络与本机回环），服务端 histogram 值更低，
      #     因此 3x 宽限在实际服务端指标上更宽松，只用于拦截数量级退化；
      #   - 精确的 20% 回归判定仍由 fixed-env 的 check_baseline.py 承担，本组规则是兜底。
      - alert: XadminCaseLatencyLogin
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(xadmin_http_request_duration_seconds_bucket{view="identity:login-by-basic"}[5m]))
          ) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "登录接口 P95 > 200ms（持续 10 分钟）"
          description: "基线 P95 66.18ms × 3。登录含口令哈希开销，先看 DB/Redis 与 worker 饱和度。"

      - alert: XadminCaseLatencyRoutes
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(xadmin_http_request_duration_seconds_bucket{view="system:user_routes"}[5m]))
          ) > 0.09
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "菜单/路由接口 P95 > 90ms（持续 10 分钟）"
          description: "基线 P95 28.38ms × 3。路由走 24h 响应缓存，退化多为缓存失效风暴或权限解析异常。"

      - alert: XadminCaseLatencyUserList
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(xadmin_http_request_duration_seconds_bucket{view="identity:user-list"}[5m]))
          ) > 0.66
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "列表页 P95 > 660ms（持续 10 分钟）"
          description: "基线 P95 192.2ms × 3。同一 view 同时承载 03-list 与 04-metadata-with-meta（页面首开），二者 service 端不可分，故阈值取两者基线较大者；退化多为排队放大或 DB 往返。"

      - alert: XadminCaseLatencyMetadataColumns
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(xadmin_http_request_duration_seconds_bucket{view="identity:user-search-columns"}[5m]))
          ) > 0.09
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "元数据·列接口 P95 > 90ms（持续 10 分钟）"
          description: "基线 P95 28.67ms × 3。纯元数据端点，载荷缓存命中下应远低于阈值。"

      - alert: XadminCaseLatencyMetadataFields
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(xadmin_http_request_duration_seconds_bucket{view="identity:user-search-fields"}[5m]))
          ) > 0.35
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "元数据·搜索字段接口 P95 > 350ms（持续 10 分钟）"
          description: "基线 P95 117.62ms × 3；该用例在 4-worker 默认档即为容量膝点，按生产容量档判定，仅拦数量级退化。"

      - alert: XadminCaseLatencyExport
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(xadmin_http_request_duration_seconds_bucket{view="identity:user-export-data"}[5m]))
          ) > 2.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "导出接口 P95 > 2.5s（持续 10 分钟）"
          description: "基线 P95 776.91ms × 3。重 IO 且量级波动大，宽限仅拦数量级退化。"

      - alert: XadminCaseLatencyImport
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(xadmin_http_request_duration_seconds_bucket{view="identity:user-import-data"}[5m]))
          ) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "导入接口 P95 > 500ms（持续 10 分钟）"
          description: "基线 P95 57.06ms × 3 后再放宽。重 IO 且耗时随文件规模线性变化，宽限仅拦数量级退化。"

  - name: xadmin-tasks
    rules:
      - alert: XadminTaskFailureRateHigh
        expr: |
          (
            sum(increase(xadmin_celery_tasks_total{status="SUCCESS"}[1d]))
              / clamp_min(sum(increase(xadmin_celery_tasks_total[1d])), 1) < 0.99
          )
            and sum(increase(xadmin_celery_tasks_total[1d])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "xadmin 任务成功率 < 99%（近 24h）"
          description: "任务成功率 SLO ≥ 99%/日；查任务日志页的失败记录与 worker 日志。"

      - alert: XadminQueueBacklogHigh
        expr: max(xadmin_celery_queue_length) > 500
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "xadmin 队列积压 > 500（{{ $labels.queue }}）"
          description: "队列 SLO 常态 < 100；先确认 beat/worker 是否停摆（observability 演练记录·beat 停摆）。"

      - alert: XadminQueueBacklogWarning
        expr: max(xadmin_celery_queue_length) > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "xadmin 队列积压 > 100（{{ $labels.queue }}）"
          description: "轻量任务被长任务拖住或 worker 副本不足：查 heavy 队列与 worker 并发。"

  # 观察项（默认注释：阈值随部署规模变化，按需开启并调参）：
  # 授权池缓存键基数 = 用户 × 菜单量级，TTL 300s 兜底（见 docs/cache-keys-audit.md 收敛预案）。
