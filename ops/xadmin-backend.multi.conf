# 多副本后端：upstream + zone + resolve（nginx 1.27.3+ 开源版即支持）。
#
# - `resolve`：副本地址运行期刷新——`--scale server=N` 扩缩容、副本重建换 IP 都
#   不需要 reload/restart nginx（解析结果按 resolver valid=10s 缓存）；
# - `zone`：resolve 的前置条件（server 组必须位于共享内存），同时承载多 worker
#   共享的后端状态；
# - 同一服务名解析出多条 A 记录（compose 的多副本）→ 组内多台后端，默认加权轮询；
#   某台连接失败时连接自动转下一台（stream 模块语义）。
#
# 注意：本形态在 nginx 启动时即要求 `server` 可解析。编排首次 up 时 nginx 可能先于
# server 容器就绪 → 启动失败并由 restart: always 重试到 DNS 出现（数十秒内收敛）；
# 因此单副本形态默认用 xadmin-backend.single.conf（变量式，无此要求）。
upstream xadmin_api {
    zone xadmin_api 64k;
    server server:8896 resolve;
}

server {
    listen 8896;
    proxy_pass xadmin_api;
}
