# xadmin-server 依赖事实源（pyproject + uv 工作区）
#
# 单一事实源约定：
#   - 运行依赖写在本文件 [project].dependencies（框架内核 xadmin-common 为工作区成员，
#     见 packages/xadmin-common/，其自身依赖声明在该成员 pyproject 中）；
#   - 开发 / 测试依赖写在 [dependency-groups].dev；
#   - requirements.txt / requirements-dev.txt 是 `uv export` 的导出产物，
#     由 tests/unit/test_dependency_manifest.py 守护三方一致（pyproject ↔ 产物 ↔ uv.lock），
#     **不要手工编辑产物文件**（改依赖请改本文件后重新导出，导出命令见 README）。
#   - 平台版本号不在此处维护（见 server/const.py 的 VERSION，文档门禁 G4 守护）。
#
# 导出命令（uv >= 0.12）：
#   uv lock
#   uv export --no-hashes --no-emit-project --no-emit-workspace --no-group dev --no-annotate -o requirements.txt
#   uv export --no-hashes --no-emit-project --no-emit-workspace --only-group dev --no-annotate -o requirements-dev.txt
#     # --no-emit-workspace：工作区成员（xadmin-common）以路径形态存在，导出的
#     # requirements 只服务 pip 安装（容器/离线/安全扫描），路径依赖无法 pip 安装故剔除
#
# 安装路径（版本依据一律是 uv.lock）：
#   uv sync --all-groups                       # 本地开发（含 dev 组）
#   uv sync --locked / uv lock --check         # CI（走官方源，可做解析一致性校验）
#   uv pip install -r requirements*.txt --index-url <镜像源>    # 容器构建
#     # 不用 uv sync --frozen：它不重新解析，会直接用 lock 里固化的 files.pythonhosted.org
#     # 地址下载、绕过镜像源（astral-sh/uv#19625），国内构建耗时差一个数量级
# 产物用途（requirements*.txt）：
#   镜像源场景的容器安装输入（与 uv.lock 的一致性由 tests/unit/test_dependency_manifest.py 守护）
#   / pip-audit -r requirements.txt（安全扫描）/ 无 uv 环境的手工与离线安装 / 国产化平台版本适配
# 可选依赖（对象存储后端，默认不装）：
#   uv sync --extra storage     或     pip install django-storages boto3

[project]
name = "xadmin-server"
version = "0.0.0"
description = "xadmin server（依赖管理用途；发布版本见 server/const.py）"
requires-python = ">=3.14"
dependencies = [
    # 框架内核（工作区成员，editable 安装；源码在 packages/xadmin-common/）
    "xadmin-common",
    "django==6.0.8",
    "djangorestframework==3.18.1",
    "django-cors-headers==4.9.0",
    "django-filter==26.1",
    "django-csp==4.0",
    "mysqlclient==2.2.8",
    "psycopg[binary,pool]==3.3.5",
    "django-redis==7.0.0",
    "pycryptodomex==3.23.0",
    "djangorestframework-simplejwt==5.5.1",
    "celery==5.6.3",
    "django-celery-beat==2.9.0",
    "django-celery-results==2.6.0",
    "flower==2.1.0",
    "python-daemon==3.1.2",
    "gunicorn==26.2.0",
    "django-proxy==1.3.0",
    "psutil==7.2.2",
    "uvicorn==0.52.4",
    "daphne==4.2.3",
    "channels==4.3.2",
    "channels-redis==4.3.0",
    "django-ranged-response==0.2.0",
    "user-agents==2.2.0",
    "aiofiles==24.1.0",
    "websockets==17.1",
    "django-imagekit==6.1.0",
    "pilkit==3.0",
    "drf-spectacular==0.30.0",
    "drf-spectacular-sidecar==2026.9.1",
    "openpyxl==3.1.5",
    # Prometheus 指标（METRICS_ENABLED=true 时启用；缺失时自动降级为 no-op）
    "prometheus-client>=0.21",
    "pyzipper==0.4.0",
    "unicodecsv==0.14.1",
    "chardet==7.6.0",
    "pyexcel==0.7.6",
    "pyexcel-xlsx==0.6.1",
    "alibabacloud-dysmsapi20170525==4.6.0",
    "phonenumbers==9.0.38",
    "pycountry==26.2.16",
    "geoip2==5.3.0",
    "ipip-ipdb==1.6.1",
    "requests==2.34.2",
    "html2text==2025.4.15",
    "pyotp==2.10.0",
    "bleach==6.4.0",
    "tinycss2==1.5.1",
    "sentry-sdk==2.68.1",
    "uvicorn-worker==0.4.0",
    "ldap3==2.9.1",
    "croniter==6.0.0",
    # OIDC id_token 验签：源码直接 import jwt / cryptography，显式声明防传递依赖漂移
    "pyjwt==2.14.0",
    "cryptography==50.0.1",
    # Passkey CBOR 解析：源码直接 import cbor2，显式声明防传递依赖漂移
    "cbor2==5.9.0",
    # 密码哈希 argon2id（PASSWORD_HASHERS 首位；登录时存量 PBKDF2 自动重哈希）
    "argon2-cffi==25.1.0",
    # 知识库文档解析（PDF/DOCX 上传，见 ai/utils/doc_extract.py）
    "pypdf==6.1.3",
    "python-docx==1.2.0",
    # AI 异步 SDK（httpx.AsyncClient，承接 S7 流式线程饥饿根治）
    "httpx==0.28.1",
    "pgvector>=0.5.0",
]

[project.optional-dependencies]
# 对象存储后端（可选依赖，默认不装；启用方式见 docs/ops/storage.md）：
#   pip install "django-storages" "boto3"   或    uv sync --extra storage
# 未安装时 SwitchableStorage 回退本地磁盘并输出去重告警（文件链路不中断）。
storage = [
    "django-storages>=1.14",
    "boto3>=1.34",
]

[dependency-groups]
# 测试与开发专用依赖（在运行依赖之外额外安装）。
# 注意：测试配置（server/settings/test.py）使用 sqlite3 内存库，
# 因此 mysqlclient 不需要安装（其需要本地编译 MySQL 客户端库）。
# CI 中可执行：
#   grep -v '^mysqlclient' requirements.txt > /tmp/req.txt
#   pip install -r /tmp/req.txt -r requirements-dev.txt
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "fakeredis[lua]>=2.23",
    "ruff>=0.6",
    # 静态类型检查（2026-09-27 引入）：首批仅测 common 框架内核，口径见 [tool.mypy]，逐步扩面
    "mypy>=1.14",
    # 性能剖析（T3.1 性能基线）：config.yml 中 SILK_ENABLED: true 时启用，仅 dev 环境
    "django-silk>=5.4",
]

[tool.mypy]
# 2026-09-27 引入（增量收口模式）：首批仅测 common 框架内核（二开 ViewSet/权限/模型层的
# 基座，价值最高、体量可控）；2026-09-28 扩面到全部业务 app（files 白名单），
# 存量告警就地修复后为 0（无 overrides 豁免）。约定：
#   - files 只列受检范围；follow_imports=silent 让依赖模块参与分析但不报错；
#   - 新文件随所属 app 自动纳入，新增告警就地修复，不得再进豁免清单；
#   - 免不了的框架误报走精确 ignore（Django Choices 元类 / simplejwt 标注 /
#     drf-spectacular 的 build_basic_type 可能返回 None / 运行期替换第三方方法）；
#   - CI 在 lint.yml 独立 job 跑 `uv run --no-sync mypy`，配置即口径。
python_version = "3.14"
files = ["ai", "approval", "captcha", "packages/xadmin-common/common", "dataset", "demo", "examples", "message", "mfa", "notifications", "server", "settings", "system", "ops", "integrations", "devtools"]
exclude = ["migrations/"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# mypy 严格度提升试点（内核先行）：common 框架层启用 strict 子集，验收后按 app 推广。
# 三个口径说明：
#   1. 逐项列出而非 `strict = true`：mypy 2.x 的 per-module `strict` 会被全局应用
#      （config_parser 对 strict 走全局 set_strict_flags，不落 per-module 选项），
#      逐项声明才能把严格面限定在内核；
#   2. `disallow_subclassing_any` 暂不启用：Django / DRF / channels / celery 未装存根，
#      其基类均为 Any，启用会放大为 ~100 处纯存根产物忽略（引入 stubs 后随推广一并重评）；
#   3. 第三方装饰器（celery signal / @shared_task / DRF @action / Django @receiver）无
#      存根导致的 untyped-decorator 走行级精确 ignore；框架侧动态值参数以显式 Any 标注
#      （显式标注而非豁免——受检意义在于新增代码不得再无标注）。
[[tool.mypy.overrides]]
module = ["common", "common.*"]
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.uv]
# 服务端本体只借助 uv 做依赖管理与锁文件，不作为可分发包构建；
# 框架内核（xadmin-common）是工作区成员，自身可 build（见 packages/xadmin-common/）
package = false
# 工具链版本下界（CI 的 astral-sh/setup-uv 依此选择版本；Dockerfile-base/Dockerfile-dev
# 的 ARG UV_VERSION 与之对齐，容器构建保持一致口径）
required-version = ">=0.12.5"

[tool.uv.workspace]
# 工作区成员：框架内核独立分发包（源码在 packages/xadmin-common/common/）
members = ["packages/*"]

[tool.uv.sources]
# 根项目消费内核：工作区成员 + editable（改 common/ 源码即时生效，无需重装）
xadmin-common = { workspace = true, editable = true }
