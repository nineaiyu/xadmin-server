# xadmin-server 依赖事实源（pyproject + uv）
#
# 单一事实源约定：
#   - 运行依赖写在本文件 [project].dependencies；
#   - 开发 / 测试依赖写在 [dependency-groups].dev；
#   - requirements.txt / requirements-dev.txt 是 `uv export` 的导出产物，
#     由 tests/unit/test_dependency_manifest.py 守护三方一致（pyproject ↔ 产物 ↔ uv.lock），
#     **不要手工编辑产物文件**（改依赖请改本文件后重新导出，导出命令见 README）。
#   - 平台版本号不在此处维护（见 server/const.py 的 VERSION，文档门禁 G4 守护）。
#
# 导出命令（uv >= 0.12）：
#   uv lock
#   uv export --no-hashes --no-emit-project --no-group dev --no-annotate -o requirements.txt
#   uv export --no-hashes --no-emit-project --only-group dev --no-annotate -o requirements-dev.txt
#
# 安装路径（本地 / 容器 / CI，一律以 uv.lock 为唯一安装依据）：
#   uv sync --all-groups                       # 本地开发（含 dev 组）
#   uv sync --frozen --no-dev                  # 容器构建（见 Dockerfile-base / Dockerfile-dev）：
#                                              #   --frozen 跳过解析校验，因镜像源候选集与 PyPI
#                                              #   不一致时 --locked 会误报「lock 需更新」；
#                                              #   该一致性由 CI 的 uv lock --check 兜底守护
# 产物用途（requirements*.txt 不再是安装依据）：
#   pip-audit -r requirements.txt（安全扫描）/ 无 uv 环境的手工与离线安装 / 国产化平台版本适配
# 可选依赖（对象存储后端，默认不装）：
#   uv sync --extra storage     或     pip install django-storages boto3

[project]
name = "xadmin-server"
version = "0.0.0"
description = "xadmin server（依赖管理用途；发布版本见 server/const.py）"
requires-python = ">=3.13"
dependencies = [
    "django==6.0.8",
    "djangorestframework==3.18.1",
    "django-cors-headers==4.9.0",
    "django-filter==26.1",
    "django-csp==4.0",
    "mysqlclient==2.2.8",
    "psycopg[binary,pool]==3.3.5",
    "django-redis==7.0.0",
    "pycryptodomex==3.23.0",
    "djangorestframework-simplejwt==5.5.1",
    "celery==5.6.3",
    "django-celery-beat==2.9.0",
    "django-celery-results==2.6.0",
    "flower==2.1.0",
    "python-daemon==3.1.2",
    "gunicorn==26.2.0",
    "django-proxy==1.3.0",
    "psutil==7.2.2",
    "uvicorn==0.52.4",
    "daphne==4.2.3",
    "channels==4.3.2",
    "channels-redis==4.3.0",
    "django-ranged-response==0.2.0",
    "user-agents==2.2.0",
    "aiofiles==24.1.0",
    "websockets==17.1",
    "django-imagekit==6.1.0",
    "pilkit==3.0",
    "drf-spectacular==0.30.0",
    "drf-spectacular-sidecar==2026.9.1",
    "openpyxl==3.1.5",
    # Prometheus 指标（METRICS_ENABLED=true 时启用；缺失时自动降级为 no-op）
    "prometheus-client>=0.21",
    "pyzipper==0.4.0",
    "unicodecsv==0.14.1",
    "chardet==7.6.0",
    "pyexcel==0.7.6",
    "pyexcel-xlsx==0.6.1",
    "alibabacloud-dysmsapi20170525==4.6.0",
    "phonenumbers==9.0.38",
    "pycountry==26.2.16",
    "geoip2==5.3.0",
    "ipip-ipdb==1.6.1",
    "requests==2.34.2",
    "html2text==2025.4.15",
    "pyotp==2.10.0",
    "bleach==6.4.0",
    "tinycss2==1.5.1",
    "sentry-sdk==2.68.1",
    "uvicorn-worker==0.4.0",
    "ldap3==2.9.1",
    "croniter==6.0.0",
    # OIDC id_token 验签：源码直接 import jwt / cryptography，显式声明防传递依赖漂移
    "pyjwt==2.14.0",
    "cryptography==50.0.1",
    # Passkey CBOR 解析：源码直接 import cbor2，显式声明防传递依赖漂移
    "cbor2==5.9.0",
]

[project.optional-dependencies]
# 对象存储后端（可选依赖，默认不装；启用方式见 docs/ops/storage.md）：
#   pip install "django-storages" "boto3"   或    uv sync --extra storage
# 未安装时 SwitchableStorage 回退本地磁盘并输出去重告警（文件链路不中断）。
storage = [
    "django-storages>=1.14",
    "boto3>=1.34",
]

[dependency-groups]
# 测试与开发专用依赖（在运行依赖之外额外安装）。
# 注意：测试配置（server/settings/test.py）使用 sqlite3 内存库，
# 因此 mysqlclient 不需要安装（其需要本地编译 MySQL 客户端库）。
# CI 中可执行：
#   grep -v '^mysqlclient' requirements.txt > /tmp/req.txt
#   pip install -r /tmp/req.txt -r requirements-dev.txt
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "fakeredis[lua]>=2.23",
    "ruff>=0.6",
    # 性能剖析（T3.1 性能基线）：config.yml 中 SILK_ENABLED: true 时启用，仅 dev 环境
    "django-silk>=5.4",
]

[tool.uv]
# 本仓库只借助 uv 做依赖管理与锁文件，不将服务端作为可分发包构建
package = false
# 工具链版本下界（CI 的 astral-sh/setup-uv 依此选择版本；Dockerfile-base/Dockerfile-dev
# 的 ARG UV_VERSION 与之对齐，容器构建保持一致口径）
required-version = ">=0.12.5"
